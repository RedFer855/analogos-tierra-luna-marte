# Motor de similitud en Rust (ADR-003). ENSAYO (ADR-005): sirve para medir tiempos y escribir recetas; el evento lo
# reconstruye desde cero. Dos partes:
#   nucleo   -> el puntaje de ADR-006 con la zona de tolerancia de ADR-008 §3.5. Sin E/S ni dependencias; apto para wasm32.
#   pipeline -> binario nativo: lee la tabla maestra por mmap, filtra, puntúa en paralelo y escribe el contrato (ADR-010).
# Nota: ADR-003 llama `puntaje` al primero; aquí se llama `nucleo` por pedido de la tarea (ver la nota de sesión).
[workspace]
resolver = "2"
members = ["nucleo", "pipeline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

# Guardarraíles de I-41 (revisión del 2026-11-12). Los `allow` solo se permiten aquí, no en el código:
# `allow_attributes` está prohibido; una excepción puntual va como `#[expect(..., reason = "...")]`.
[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"

float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
cast_possible_wrap = "deny"

# Ruido de `pedantic` que I-41 recomienda bajar antes de dárselo a un agente.
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
